<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // REALITY DESTABILIZED — GFG × Bennett University</title>
  <meta name="description" content="Dimensional incursion failure. The multiverse timeline you requested has ceased to exist. Return to mission base.">
  <meta name="robots" content="noindex, follow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230A0A0A'/><circle cx='50' cy='50' r='42' fill='none' stroke='%23D91E36' stroke-width='6'/><polygon points='50,22 75,65 25,65' fill='none' stroke='%233AFFA0' stroke-width='5'/><circle cx='50' cy='50' r='7' fill='%233AFFA0'/></svg>">
  <meta name="theme-color" content="#0A0A0A">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
      position: relative;
      background: radial-gradient(ellipse at center, rgba(217, 30, 54, 0.12) 0%, rgba(10, 10, 10, 0.95) 60%, #0A0A0A 100%);
      overflow: hidden;
    }

    .error-backdrop-ring {
      position: absolute;
      width: min(500px, 80vw);
      height: min(500px, 80vw);
      border-radius: 50%;
      border: 1px dashed rgba(58, 255, 160, 0.2);
      pointer-events: none;
      animation: rotateConic 35s linear infinite;
    }

    .error-code {
      font-family: var(--font-display, 'Bebas Neue', Impact, sans-serif);
      font-size: clamp(6.5rem, 20vw, 14rem);
      line-height: 0.88;
      letter-spacing: 0.04em;
      color: var(--accent-red, #D91E36);
      text-shadow: 0 0 50px rgba(217, 30, 54, 0.6), 0 0 100px rgba(217, 30, 54, 0.25);
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 2;
    }

    .error-tag {
      font-family: var(--font-mono, 'Space Grotesk', monospace);
      font-size: clamp(0.75rem, 1.8vw, 0.95rem);
      letter-spacing: 0.28em;
      color: #3AFFA0;
      margin-bottom: 1.2rem;
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .error-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3AFFA0;
      box-shadow: 0 0 8px #3AFFA0;
      animation: radarPulse 1.5s infinite;
    }

    .error-headline {
      font-family: var(--font-display, 'Bebas Neue', Impact, sans-serif);
      font-size: clamp(2rem, 5vw, 3.8rem);
      letter-spacing: 0.04em;
      color: #FFFFFF;
      margin-bottom: 1.2rem;
      position: relative;
      z-index: 2;
    }

    .error-description {
      font-family: var(--font-body, 'Inter', sans-serif);
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      line-height: 1.65;
      color: var(--text-secondary, #B3B3AD);
      max-width: 540px;
      margin-bottom: 2.8rem;
      position: relative;
      z-index: 2;
    }

    .error-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>

  <main class="error-page-container">
    <div class="error-backdrop-ring" aria-hidden="true"></div>

    <div class="error-tag">
      <span class="error-tag-dot" aria-hidden="true"></span>
      <span>DIMENSIONAL BREACH // REALITY DESYNCHRONIZED</span>
    </div>

    <div class="error-code">404</div>
    <h1 class="error-headline">TIMELINE COLLAPSED</h1>

    <p class="error-description">
      The multiverse coordinates you entered have been disintegrated from this branch of reality. Fall back to mission headquarters to rejoin the Junior Core vanguard.
    </p>

    <div class="error-actions">
      <a href="index.html" class="btn btn-primary btn-cta-primary" aria-label="Return to Mission Homepage">
        <span class="btn-glow" aria-hidden="true"></span>
        <span class="btn-text">RETURN TO MISSION BASE</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </a>
      <a href="register.html" class="btn btn-ghost btn-cta-secondary" aria-label="Proceed to Recruitment Registration">
        <span class="btn-text">RECRUITMENT PORTAL</span>
        <span class="btn-arrow" aria-hidden="true">↗</span>
      </a>
    </div>
  </main>
</body>
</html>
